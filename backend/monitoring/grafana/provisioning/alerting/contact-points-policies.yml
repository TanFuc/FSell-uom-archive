apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram-critical
    receivers:
      - uid: telegram-critical
        type: telegram
        settings:
          bottoken: ${GF_ALERT_TELEGRAM_BOT_TOKEN}
          chatid: ${GF_ALERT_TELEGRAM_CHAT_ID}
          parse_mode: HTML
          disable_web_page_preview: true
          message: '{{ template "uom.alert.message" . }}'

  - orgId: 1
    name: slack-warning
    receivers:
      - uid: slack-warning
        type: slack
        settings:
          url: ${GF_ALERT_SLACK_WEBHOOK_URL}
          title: '{{ template "uom.alert.title" . }}'
          text: '{{ template "uom.alert.message" . }}'

  - orgId: 1
    name: email-default
    receivers:
      - uid: email-default
        type: email
        settings:
          addresses: ${GF_ALERT_EMAIL_ADDRESSES}
          singleEmail: false
          subject: '{{ template "uom.alert.title" . }}'
          message: '{{ template "uom.alert.message" . }}'

policies:
  - orgId: 1
    receiver: email-default
    group_by: ['alertname', 'service']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: telegram-critical
        object_matchers:
          - ['severity', '=', 'critical']
        continue: true

      - receiver: slack-warning
        object_matchers:
          - ['severity', '=', 'warning']
        continue: true

templates:
  - orgId: 1
    name: uom-alert-template
    template: |
      {{ define "uom.alert.title" }}
      [{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})
      {{ end }}

      {{ define "uom.alert.message" }}
      Alert: {{ .CommonLabels.alertname }}
      Status: {{ .Status }}
      Severity: {{ .CommonLabels.severity }}
      Service: {{ .CommonLabels.service }}

      {{ if .CommonAnnotations.summary }}Summary: {{ .CommonAnnotations.summary }}{{ end }}
      {{ if .CommonAnnotations.description }}
      Description: {{ .CommonAnnotations.description }}
      {{ end }}
      {{ if .ExternalURL }}
      URL: {{ .ExternalURL }}
      {{ end }}
      {{ end }}
