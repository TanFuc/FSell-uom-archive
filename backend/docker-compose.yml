version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uom_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uom_user
      POSTGRES_PASSWORD: uom_password
      POSTGRES_DB: uom_archive
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uom_user -d uom_archive']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uom_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
